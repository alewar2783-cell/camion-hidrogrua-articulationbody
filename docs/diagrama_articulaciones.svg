<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" width="1040" height="780" font-family="Segoe UI, Arial, sans-serif" fill="#111">
<title>Árbol de articulaciones del camión con hidrogrúa</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs>
<rect width="1040" height="780" fill="#ffffff"/>
<path d="M530 80 V105 H230 V130" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M530 105 H830 V130" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M230 200 V230" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M230 300 V330" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M230 400 V430" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M230 500 V530" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M230 600 V615 H130 V630" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M230 615 H330 V630" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M830 200 V230" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="380" y="10" width="300" height="70" rx="8" fill="#eeeeee" stroke="#444444" stroke-width="2"/>
<text x="530.0" y="32" text-anchor="middle" font-weight="bold" font-size="15">1 Chasis_Root</text>
<text x="530.0" y="52" text-anchor="middle" font-size="13">raíz, immovable</text>
<text x="530.0" y="70" text-anchor="middle" font-size="13">1000 kg</text>
<rect x="60" y="130" width="340" height="70" rx="8" fill="#e8f0fe" stroke="#1a56a8" stroke-width="2"/>
<text x="230.0" y="152" text-anchor="middle" font-weight="bold" font-size="15">2 Torre_Base</text>
<text x="230.0" y="172" text-anchor="middle" font-size="13">Revolute · eje Y</text>
<text x="230.0" y="190" text-anchor="middle" font-size="13">-170° a 170°</text>
<rect x="60" y="230" width="340" height="70" rx="8" fill="#e8f0fe" stroke="#1a56a8" stroke-width="2"/>
<text x="230.0" y="252" text-anchor="middle" font-weight="bold" font-size="15">3 Brazo_Principal</text>
<text x="230.0" y="272" text-anchor="middle" font-size="13">Revolute · eje X</text>
<text x="230.0" y="290" text-anchor="middle" font-size="13">-15° a 75°</text>
<rect x="60" y="330" width="340" height="70" rx="8" fill="#e8f0fe" stroke="#1a56a8" stroke-width="2"/>
<text x="230.0" y="352" text-anchor="middle" font-weight="bold" font-size="15">4 Brazo_Secundario</text>
<text x="230.0" y="372" text-anchor="middle" font-size="13">Revolute · eje X</text>
<text x="230.0" y="390" text-anchor="middle" font-size="13">-125° a 15°</text>
<rect x="60" y="430" width="340" height="70" rx="8" fill="#e8f0fe" stroke="#1a56a8" stroke-width="2"/>
<text x="230.0" y="452" text-anchor="middle" font-weight="bold" font-size="15">5 Tramo_Telescopico</text>
<text x="230.0" y="472" text-anchor="middle" font-size="13">Prismatic · eje Z</text>
<text x="230.0" y="490" text-anchor="middle" font-size="13">0 a 2.5 m</text>
<rect x="60" y="530" width="340" height="70" rx="8" fill="#fff4e0" stroke="#b86e00" stroke-width="2" stroke-dasharray="7 4"/>
<text x="230.0" y="552" text-anchor="middle" font-weight="bold" font-size="15">6 Cabezal_Pinza (pasivo)</text>
<text x="230.0" y="572" text-anchor="middle" font-size="13">Spherical · twist bloqueado</text>
<text x="230.0" y="590" text-anchor="middle" font-size="13">swing Y y Z ±40°</text>
<rect x="35" y="630" width="190" height="70" rx="8" fill="#e8f0fe" stroke="#1a56a8" stroke-width="2"/>
<text x="130.0" y="652" text-anchor="middle" font-weight="bold" font-size="15">7 Dedo_Izquierdo</text>
<text x="130.0" y="672" text-anchor="middle" font-size="13">Prismatic · eje X</text>
<text x="130.0" y="690" text-anchor="middle" font-size="13">0 a 0.35 m</text>
<rect x="235" y="630" width="190" height="70" rx="8" fill="#e8f0fe" stroke="#1a56a8" stroke-width="2"/>
<text x="330.0" y="652" text-anchor="middle" font-weight="bold" font-size="15">8 Dedo_Derecho</text>
<text x="330.0" y="672" text-anchor="middle" font-size="13">Prismatic · eje X</text>
<text x="330.0" y="690" text-anchor="middle" font-size="13">-0.35 a 0 m</text>
<rect x="680" y="130" width="300" height="70" rx="8" fill="#e8f0fe" stroke="#1a56a8" stroke-width="2"/>
<text x="830.0" y="152" text-anchor="middle" font-weight="bold" font-size="15">9 Caja_Volcadora</text>
<text x="830.0" y="172" text-anchor="middle" font-size="13">Revolute · eje X</text>
<text x="830.0" y="190" text-anchor="middle" font-size="13">0° a 55°</text>
<rect x="680" y="230" width="300" height="70" rx="8" fill="#fff4e0" stroke="#b86e00" stroke-width="2" stroke-dasharray="7 4"/>
<text x="830.0" y="252" text-anchor="middle" font-weight="bold" font-size="15">10 Compuerta_Trasera (pasivo)</text>
<text x="830.0" y="272" text-anchor="middle" font-size="13">Revolute · eje X</text>
<text x="830.0" y="290" text-anchor="middle" font-size="13">0° a 95°</text>
<rect x="560" y="640" width="440" height="110" rx="6" fill="#fafafa" stroke="#999"/>
<text x="575" y="664" font-size="13" font-weight="bold">Referencias</text>
<text x="575" y="686" font-size="12">Cuadro de línea continua: joint con drive controlado.</text>
<text x="575" y="705" font-size="12">Cuadro punteado naranja: joint pasivo (stiffness 0).</text>
<text x="575" y="724" font-size="12">Ángulos en grados y distancias en metros, relativos al padre.</text>
<text x="575" y="743" font-size="12">Los dos dedos comparten un comando (+t y -t).</text>
</svg>
